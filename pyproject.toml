[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "darai-voice-agent"
version = "2.0.0"
description = "Arabic voice agent for DarAI over LiveKit"
requires-python = ">=3.11"
dependencies = [
  "livekit-agents[openai,google,silero,elevenlabs]==1.8.11",
  "livekit-api>=1.0,<2",
  "google-genai==2.30.1",
  "python-dotenv>=1.0,<2",
  "aiohttp>=3.9,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
voice-agent = "voice_agent.entrypoints.worker:main"
voice-web = "voice_agent.entrypoints.token_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
